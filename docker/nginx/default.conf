# =============================================================
# Atheres Atlas — Nginx Reverse Proxy
# Single entry point on port 80
#
# Routing:
#   /api/negotiate  →  functions:80  (SignalR negotiate, WebSocket upgrade)
#   /api/auth/*     →  auth:80       (Auth Functions — Identity/JWT)
#   /api/*          →  functions:80  (Azure Functions HTTP endpoints)
#   /*              →  frontend:80   (React SPA)
# =============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream functions_upstream {
    server functions:80;
    keepalive 32;
}

upstream auth_upstream {
    server auth:80;
    keepalive 16;
}

upstream frontend_upstream {
    server frontend:80;
    keepalive 16;
}

server {
    listen      80;
    server_name _;

    client_max_body_size 20M;

    # --------------------------------------------------------
    # SignalR negotiate + WebSocket hub
    # Must come before the generic /api/ block
    # --------------------------------------------------------
    location /api/negotiate {
        proxy_pass         http://functions_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;   # keep WebSocket alive for 24 h
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------
    # Auth Functions  (Identity / JWT)
    # Must come before the generic /api/ block
    # --------------------------------------------------------
    location /api/auth/ {
        proxy_pass         http://auth_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # --------------------------------------------------------
    # Azure Functions REST API
    # --------------------------------------------------------
    location /api/ {
        proxy_pass         http://functions_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        # Expose the Function App key header so clients can set it
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, x-functions-key, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # --------------------------------------------------------
    # React SPA (everything else)
    # --------------------------------------------------------
    location / {
        proxy_pass         http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------
    # Composite health check (nginx itself)
    # --------------------------------------------------------
    location = /health {
        access_log off;
        return 200 "atlas-nginx ok\n";
        add_header Content-Type text/plain;
    }
}
